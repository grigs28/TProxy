# Node.js (npm) 缓存
#
# 元数据 JSON 会更新（短 TTL），tarball 内容寻址（长 TTL）。
#
# ⚠️ npm 的元数据响应通常带 Content-Encoding: gzip。nginx 缓存时按原样存储
# 压缩字节流是安全的（客户端声明 Accept-Encoding 后才拿到该变体），
# 但**客户端必须支持解压**，否则会拿到无法解析的二进制。

server {
    listen 443 ssl;
    http2 on;
    server_name registry.npmjs.org registry.npmmirror.com nodejs.org;

    ssl_certificate     /etc/nginx/certs/$ssl_server_name.crt;
    ssl_certificate_key /etc/nginx/certs/$ssl_server_name.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/nodejs.log main;
    client_max_body_size 0;
    proxy_connect_timeout 30s;
    proxy_read_timeout 1800s;
    proxy_set_header Host $host;
    proxy_ssl_server_name on;
    proxy_redirect off;
    proxy_cache npm_cache;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # registry.npmjs.org 经 Cloudflare，响应带 __cf_bm / _cfuvid 两个 Set-Cookie。
    # nginx 默认【不缓存】带 Set-Cookie 的响应（视为个性化内容），会导致缓存恒为 MISS。
    # 这两个是 CF 的 bot 检测 cookie，npm 客户端本就忽略：
    #   proxy_hide_header   —— 不把它们转发给客户端（避免污染共享缓存）
    #   proxy_ignore_headers —— 不让它们阻止缓存
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie;

    # 包 tarball：长 TTL
    location ~* \.tgz$ {
        proxy_cache_valid 200 302 365d;
        proxy_pass https://$host$request_uri;
    }

    # 元数据 JSON 与其余：短 TTL
    location / {
        proxy_cache_valid 200 302 10m;
        proxy_pass https://$host$request_uri;
    }
}
