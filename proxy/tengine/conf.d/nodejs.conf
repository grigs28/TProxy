# Node.js (npm) 缓存
#
# 元数据 JSON 会更新（短 TTL），tarball 内容寻址（长 TTL）。
#
# ⚠️ 内容协商必须显式处理，否则会串味：
#
#   · Content-Encoding —— nginx 的 proxy_cache **不遵守 Vary: Accept-Encoding**，
#     也不把该头纳入 cache key。若放任上游返回 gzip，则第一个被缓存的压缩变体
#     会发给所有客户端，不支持解压者直接失败。这里统一置空 Accept-Encoding，
#     让上游返回明文 —— 内网带宽不是瓶颈，正确性优先。
#
#   · Accept —— npm 按该头返回「精简元数据」(application/vnd.npm.install-v1+json)
#     或完整 JSON。二者字段不同：真实 npm 客户端要精简版，而 curl/脚本常要完整版。
#     若混用且不区分缓存，先到者胜出，后者会拿到缺字段的数据。
#     故把 $http_accept 纳入 cache key，各取所需。

server {
    listen 443 ssl;
    http2 on;
    server_name registry.npmjs.org registry.npmmirror.com nodejs.org;

    ssl_certificate     /etc/nginx/certs/$ssl_server_name.crt;
    ssl_certificate_key /etc/nginx/certs/$ssl_server_name.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/nodejs.log main;
    client_max_body_size 0;
    proxy_connect_timeout 30s;
    proxy_read_timeout 1800s;
    proxy_set_header Host $host;
    proxy_ssl_server_name on;
    proxy_redirect off;
    proxy_cache npm_cache;
    # 纳入 Accept：区分「精简元数据」与「完整 JSON」两种变体
    proxy_cache_key "$scheme$host$request_uri|$http_accept";
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # 强制上游返回明文，消除压缩变体带来的缓存串味
    proxy_set_header Accept-Encoding "";

    # registry.npmjs.org 经 Cloudflare，响应带 __cf_bm / _cfuvid 两个 Set-Cookie。
    # nginx 默认【不缓存】带 Set-Cookie 的响应（视为个性化内容），会导致缓存恒为 MISS。
    # 这两个是 CF 的 bot 检测 cookie，npm 客户端本就忽略：
    #   proxy_hide_header   —— 不把它们转发给客户端（避免污染共享缓存）
    #   proxy_ignore_headers —— 不让它们阻止缓存
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie;

    # 包 tarball：长 TTL
    location ~* \.tgz$ {
        proxy_cache_valid 200 302 365d;
        proxy_pass https://$host$request_uri;
    }

    # 元数据 JSON 与其余：短 TTL
    location / {
        proxy_cache_valid 200 302 10m;
        proxy_pass https://$host$request_uri;
    }
}
