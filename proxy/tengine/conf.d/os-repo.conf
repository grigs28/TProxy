# proxy/tengine/conf.d/os-repo.conf
# 系统包仓库缓存 —— HTTP 源（Ubuntu / CentOS 及国内镜像站）

proxy_cache os_cache;
proxy_cache_key "$scheme$host$request_uri";
proxy_cache_lock on;
proxy_cache_background_update on;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_valid 404 1m;

add_header X-Cache-Status $upstream_cache_status always;

server {
    listen 80;
    server_name archive.ubuntu.com security.ubuntu.com cn.archive.ubuntu.com
                ports.ubuntu.com mirror.centos.org mirrorlist.centos.org
                dl.fedoraproject.org mirrors.fedoraproject.org
                mirrors.aliyun.com mirrors.tuna.tsinghua.edu.cn
                mirrors.ustc.edu.cn mirrors.huaweicloud.com
                # Debian 官方源（PVE 机群 16 台在用；证书早已签好却一直没接上来）
                deb.debian.org security.debian.org
                # Proxmox（PVE/PBS/Ceph，14 台）
                download.proxmox.com
                # AI / GPU 工具（.70/.71）
                nvidia.github.io developer.download.nvidia.com
                # GitHub CLI 的 RPM 源（.14/.18）；它同时也在 git.conf 的
                # server_name 里 —— 但那个只在 443 且是 git 协议端点，包仓库走这里
                cli.github.com
                # 腾讯云镜像站（.9 的 EPEL）
                mirrors.cloud.tencent.com;

    access_log /var/log/nginx/os-repo.log main;

    # 元数据：短 TTL —— 缓存过久会让客户端看不到新发布的包
    location ~* /(repodata/.*\.(xml|gz|zst)$|Packages(\.(gz|xz|zst|lz4))?$|Contents.*\.(gz|xz|zst)$|Release(\.gpg)?$|InRelease$) {
        proxy_cache_valid 200 302 10m;
        proxy_pass $scheme://$host$request_uri;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # 制品：长 TTL —— 内容寻址，文件名含版本，永不改变。
    # /by-hash/ 是 Debian 系元数据的按内容寻址路径（/by-hash/SHA256/<哈希>），
    # 同样不可变。不加这条它会落到下面 30m 的默认规则上 ——
    # Debian 的 apt 默认开启 Acquire-By-Hash，每次更新都要回源重取
    # 几十个元数据分片，缓存等于只起了三成作用。
    location ~* (\.(rpm|deb|dsc|tar\.(gz|xz|bz2)|zst)$|/by-hash/) {
        proxy_cache_valid 200 302 365d;
        proxy_pass $scheme://$host$request_uri;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # 其余（目录索引等）
    location / {
        proxy_cache_valid 200 302 30m;
        proxy_pass $scheme://$host$request_uri;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}

# ---- HTTPS 系统包仓库（TLS 终结 / MITM）----
# 按 SNI 动态选取证书：域名可枚举，预签发的证书文件名即域名，无需动态签发组件。
server {
    listen 443 ssl;
    http2 on;
    server_name repo.openeuler.org mirrors.openeuler.org
                dl-cdn.openeuler.openatom.cn
                security.ubuntu.com mirrors.aliyun.com
                # 以下 7 个与块 1（HTTP）**同一批** —— 两个块都放，
                # 免得「某个源走 https 就失效」。证书都已签发。
                # ⚠️ 当初就是因为只在块 1 放了系统源，块 2 只有 openEuler 那批，
                #    导致 https 访问这些域名会落到 default_server。
                deb.debian.org security.debian.org
                download.proxmox.com
                nvidia.github.io developer.download.nvidia.com
                cli.github.com
                mirrors.cloud.tencent.com;

    ssl_certificate     /etc/nginx/certs/$ssl_server_name.crt;
    ssl_certificate_key /etc/nginx/certs/$ssl_server_name.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/os-repo-ssl.log main;

    # server 级可用的代理指令（注意 proxy_pass 只能在 location 内）
    proxy_cache os_cache;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_set_header Host $host;
    proxy_ssl_server_name on;
    proxy_redirect off;

    # 元数据：短 TTL
    location ~* /(repodata/.*\.(xml|gz|zst)$|Packages(\.(gz|xz|zst|lz4))?$|Contents.*\.(gz|xz|zst)$|Release(\.gpg)?$|InRelease$) {
        proxy_cache_valid 200 302 10m;
        proxy_pass https://$host$request_uri;
    }

    # 制品：长 TTL
    location ~* (\.(rpm|deb|dsc|tar\.(gz|xz|bz2)|zst)$|/by-hash/) {
        proxy_cache_valid 200 302 365d;
        proxy_pass https://$host$request_uri;
    }

    location / {
        proxy_cache_valid 200 302 30m;
        proxy_pass https://$host$request_uri;
    }
}

# ---- 兜底：未匹配任何 server_name 的请求 ----
# 这个块是必需的：否则未知 Host（如健康检查用的 127.0.0.1）会落到第一个
# server 块，而它的 proxy_pass $scheme://$host 会把请求代回代理自身
# （$host 解析为 127.0.0.1），形成死循环 —— 健康检查的超时正是由此产生。
server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/default.log main;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 供客户端下载根 CA —— client-setup.sh 默认请求此路径。
    # 客户端访问的是 IP（Host: 192.168.0.18），不会匹配任何 server_name，
    # 因此必须放在 default_server 里，否则会被下面的 444 拒掉。
    location = /tproxy-ca.crt {
        alias /usr/share/nginx/tproxy-ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location / {
        return 444;   # 直接关闭连接，不做任何代理
    }
}
