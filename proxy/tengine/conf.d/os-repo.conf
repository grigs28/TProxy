# proxy/tengine/conf.d/os-repo.conf
# 系统包仓库缓存 —— HTTP 源（Ubuntu / CentOS 及国内镜像站）

proxy_cache os_cache;
proxy_cache_key "$scheme$host$request_uri";
proxy_cache_lock on;
proxy_cache_background_update on;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_valid 404 1m;

# ⚠️ 必须忽略 Set-Cookie，否则本项目大量路径**根本不会缓存**。
#
# archive.ubuntu.com / repo1.maven.org 等走 Cloudflare，**每个响应都带**
#   `Set-Cookie: __cf_bm=...`（机器人管理 cookie，HttpOnly、与内容无关）。
# nginx 的默认规则是「响应含 Set-Cookie 就不缓存」，于是：
#   · 2026-11 实测 Maven 缓存自 9/23 起零 HIT（已在 java.conf 修）
#   · 2026-11-25 实测 Ubuntu 的 by-hash 路径返回 200 但 cache 状态为空——
#     即「明明配了 30 天缓存，实际一次都没写进去」
#
# 这些镜像的 cookie 对公开包仓库没有任何意义，忽略即可。
# （被忽略的 Set-Cookie 不会转发给客户端。）
proxy_ignore_headers Set-Cookie;

add_header X-Cache-Status $upstream_cache_status always;

server {
    listen 80;
    server_name archive.ubuntu.com security.ubuntu.com cn.archive.ubuntu.com
                ports.ubuntu.com mirror.centos.org mirrorlist.centos.org
                dl.fedoraproject.org mirrors.fedoraproject.org
                mirrors.aliyun.com mirrors.tuna.tsinghua.edu.cn
                mirrors.ustc.edu.cn mirrors.huaweicloud.com
                # Debian 官方源（PVE 机群 16 台在用；证书早已签好却一直没接上来）
                deb.debian.org security.debian.org
                # Proxmox（PVE/PBS/Ceph，14 台）
                download.proxmox.com
                # AI / GPU 工具（.70/.71）
                nvidia.github.io developer.download.nvidia.com
                # GitHub CLI 的 RPM 源（.14/.18）；它同时也在 git.conf 的
                # server_name 里 —— 但那个只在 443 且是 git 协议端点，包仓库走这里
                cli.github.com
                # 腾讯云镜像站（.9 的 EPEL）
                mirrors.cloud.tencent.com
                # .NET / NuGet 包源（BiaoShu 的 openxmlhelper 构建用）
                api.nuget.org;

    access_log /var/log/nginx/os-repo.log main;

    # ── ① 可变指针：**绝不缓存** ──────────────────────────────────
    #
    # InRelease / Release 里写着各索引的哈希；repomd.xml 里写着各元数据的哈希。
    # 它们一旦陈旧，客户端就会拿着**旧哈希**去取文件：
    #   · apt 先试 /by-hash/SHA256/<旧哈希> → 上游已删 → 404
    #   · 再回退到 canonical 路径（Packages.gz，已是新版）→ 哈希对不上 → 校验失败
    # 实测 2026-11-25：noble-updates 的 InRelease 卡在 11-18 整整一周，
    # main/restricted/universe 三个索引尺寸全部对不上，apt 直接报错。
    #
    # 代价极小（apt 每次 ~126KB、dnf 的 repomd.xml 几 KB），换来「指针永远新鲜」。
    # ⚠️ 必须排在最前 —— nginx 的正则 location 按出现顺序匹配。
    location ~* /(InRelease|Release|Release\.gpg|repomd\.xml)$ {
        proxy_cache off;
        proxy_pass $scheme://$host$request_uri;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # ── ② 内容寻址的索引：不可变，长缓存 ───────────────────────────
    #
    #   · Debian/Ubuntu: /by-hash/SHA256/<哈希>
    #   · openEuler 等 RPM: repodata/<64位hex>-primary.xml.gz（文件名自带校验和）
    # 路径本身就是内容哈希 → 同一路径的内容永不改变 → 长缓存安全。
    location ~* "(/(by-hash/)|/[0-9a-f]{64}-[^/]+$)" {
        proxy_cache_valid 200 302 30d;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_pass $scheme://$host$request_uri;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # ── ③ canonical 索引：**不缓存** ───────────────────────────────
    #
    # Packages / Sources / Contents / Translation-* 都是**可变**文件。
    # 缓存它们就可能与上面的指针不同步 —— 这正是「半新半旧」的来源。
    # 实测客户端几乎不用 by-hash（HTTPS 侧 3 次 vs canonical 1762 次），
    # 所以这里用「正确性换流量」：每次 apt update 多下几 MB 索引，
    # 换来永不出现「新指针 + 旧索引」的校验失败。
    # （.deb/.rpm 制品仍然缓存，那才是流量大头。）
    location ~* /(Packages|Sources|Contents|Translation-)[._-] {
        proxy_cache off;
        proxy_pass $scheme://$host$request_uri;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # repodata 下**非**哈希命名的文件（如旧式 primary.xml.gz）同样是可变的，
    # 不缓存。哈希命名的已被上面 ② 接走。
    location ~* /repodata/ {
        proxy_cache off;
        proxy_pass $scheme://$host$request_uri;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # 制品：1 天 TTL + 强制重验证
    # （/by-hash/ 已移到上面的 ② 内容寻址段 —— 那里按哈希路径长缓存 30 天。）
    location ~* \.(rpm|deb|dsc|nupkg|tar\.(gz|xz|bz2)|zst)$ {
        # ⚠️ 制品的正确性策略：**1 天 TTL + 强制重验证**。
        #
        # 背景：**上游会原地替换包文件**（版本号不变、内容变了）。
        # 实测 2026-11-16：openEuler 重建了 sssd 2.9.4-34 整批
        # （libipa_hbac、libsss_autofs、libsss_certmap…），
        # 缓存里的旧副本一直没刷新 → 客户端 dnf 校验失败
        # （`checksum doesn't match` → `No more mirrors to try`）。
        #
        # 曾用 365d（基于「包文件不可变」的假设），后改 30d —— 都治标：
        # 旧副本在 TTL 到期前仍会被供出去。现在改成「先问上游」：
        #
        #   proxy_cache_revalidate on
        #     条目过期后，nginx 带上 If-Modified-Since / If-None-Match 回源：
        #       · 上游没变 → 304（0 字节）→ 续用缓存，几乎零成本
        #       · 上游变了 → 200 + 新文件 → 自动更新
        #     实测这个 CDN 支持条件请求（有 ETag / Last-Modified，304 返回 0B）。
        #
        #   TTL 1d
        #     决定「多久问一次」。1 天 = 任何原地替换最多 1 天后被纠正。
        #     每次只多一个 304 往返，代价可忽略。
        #
        #   proxy_cache_use_stale 覆盖掉 server 级的配置
        #     server 级含 `updating`：过期后首个客户端会拿到旧副本、后台再更新。
        #     对可校验的包来说，旧副本 = 校验失败 = 装不上，所以这里去掉 updating
        #     —— 宁可让那个客户端多等一下重验证，也不给它错文件。
        #     （error/timeout 保留：上游真挂了时，旧副本还有可能是对的。）
        proxy_cache_valid 200 302 1d;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_pass $scheme://$host$request_uri;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # 其余（目录索引等）
    location / {
        proxy_cache_valid 200 302 30m;
        proxy_pass $scheme://$host$request_uri;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}

# ---- HTTPS 系统包仓库（TLS 终结 / MITM）----
# 按 SNI 动态选取证书：域名可枚举，预签发的证书文件名即域名，无需动态签发组件。
server {
    listen 443 ssl;
    http2 on;
    server_name repo.openeuler.org mirrors.openeuler.org
                dl-cdn.openeuler.openatom.cn
                security.ubuntu.com mirrors.aliyun.com
                # ⚠️ 以下是块 1（HTTP）里一直有、但**块 2 漏了**的域名。
                #    漏了的后果：HTTPS 请求匹配不到本块 → 落到 git.conf 的
                #    兜底 location / —— 能代理、能通，但 **proxy_cache off，
                #    等于完全不缓存**。实测 2026-11-25：archive.ubuntu.com 的
                #    by-hash 请求被记进 git.log（cache=-），缓存文件根本没生成。
                archive.ubuntu.com cn.archive.ubuntu.com ports.ubuntu.com
                mirror.centos.org mirrorlist.centos.org
                dl.fedoraproject.org mirrors.fedoraproject.org
                mirrors.tuna.tsinghua.edu.cn
                mirrors.ustc.edu.cn mirrors.huaweicloud.com
                # 以下 7 个与块 1（HTTP）**同一批** —— 两个块都放，
                # 免得「某个源走 https 就失效」。证书都已签发。
                # ⚠️ 当初就是因为只在块 1 放了系统源，块 2 只有 openEuler 那批，
                #    导致 https 访问这些域名会落到 default_server。
                deb.debian.org security.debian.org
                download.proxmox.com
                nvidia.github.io developer.download.nvidia.com
                cli.github.com
                mirrors.cloud.tencent.com
                # .NET / NuGet 包源
                api.nuget.org;

    ssl_certificate     /etc/nginx/certs/$ssl_server_name.crt;
    ssl_certificate_key /etc/nginx/certs/$ssl_server_name.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/os-repo-ssl.log main;

    # server 级可用的代理指令（注意 proxy_pass 只能在 location 内）
    proxy_cache os_cache;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_set_header Host $host;
    proxy_ssl_server_name on;
    proxy_redirect off;

    # ① 可变指针：绝不缓存（为什么见上方 HTTP 块里的完整说明）
    location ~* /(InRelease|Release|Release\.gpg|repomd\.xml)$ {
        proxy_cache off;
        proxy_pass https://$host$request_uri;
    }

    # ② 内容寻址：不可变，长缓存
    location ~* "(/(by-hash/)|/[0-9a-f]{64}-[^/]+$)" {
        proxy_cache_valid 200 302 30d;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_pass https://$host$request_uri;
    }

    # ③ canonical 索引：不缓存
    location ~* /(Packages|Sources|Contents|Translation-)[._-] {
        proxy_cache off;
        proxy_pass https://$host$request_uri;
    }

    # ③b repodata 下非哈希命名的文件：不缓存
    location ~* /repodata/ {
        proxy_cache off;
        proxy_pass https://$host$request_uri;
    }

    # 制品：1 天 TTL + 强制重验证（「上游确认过才提供」；
    # 为什么不是 365d/30d、以及 use_stale 为何要覆盖，见上方 HTTP 块里的说明）
    location ~* \.(rpm|deb|dsc|nupkg|tar\.(gz|xz|bz2)|zst)$ {
        proxy_cache_valid 200 302 1d;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_pass https://$host$request_uri;
    }

    location / {
        proxy_cache_valid 200 302 30m;
        proxy_pass https://$host$request_uri;
    }
}

# ---- 兜底：未匹配任何 server_name 的请求 ----
# 这个块是必需的：否则未知 Host（如健康检查用的 127.0.0.1）会落到第一个
# server 块，而它的 proxy_pass $scheme://$host 会把请求代回代理自身
# （$host 解析为 127.0.0.1），形成死循环 —— 健康检查的超时正是由此产生。
server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/default.log main;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 供客户端下载根 CA —— client-setup.sh 默认请求此路径。
    # 客户端访问的是 IP（Host: 192.168.0.18），不会匹配任何 server_name，
    # 因此必须放在 default_server 里，否则会被下面的 444 拒掉。
    location = /tproxy-ca.crt {
        alias /usr/share/nginx/tproxy-ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location / {
        return 444;   # 直接关闭连接，不做任何代理
    }
}
