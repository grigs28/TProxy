# Java (Maven) 制品缓存
#
# ⚠️ 本文件的核心不是「能缓存什么」，而是「什么绝不能缓存」：
#
#   · maven-metadata.xml —— 版本清单，会随新版本发布而变
#   · *-SNAPSHOT*       —— 同一版本号的内容会被覆盖
#
# 一旦缓存它们，客户端将**永远解析不到新版本**，而且构建**不会报任何错**——
# 只会静默地一直使用旧依赖。这是本类型独有、且最难排查的失败模式。
#
# 因此：元数据与 SNAPSHOT 的 location 必须【排在 release 制品之前】
# （nginx 正则 location 按出现顺序匹配，先命中者胜出）。

server {
    listen 443 ssl;
    http2 on;
    server_name repo1.maven.org repo.maven.apache.org maven.aliyun.com;

    ssl_certificate     /etc/nginx/certs/$ssl_server_name.crt;
    ssl_certificate_key /etc/nginx/certs/$ssl_server_name.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/java.log main;
    client_max_body_size 0;
    proxy_connect_timeout 30s;
    proxy_read_timeout 1800s;
    proxy_set_header Host $host;
    proxy_ssl_server_name on;
    proxy_redirect off;
    proxy_cache mvn_cache;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_lock on;

    # ⚠️ 必须忽略 Set-Cookie，否则 Maven Central 的缓存**根本不工作**。
    #
    # repo1.maven.org 走 Cloudflare，**每个 GET 响应都带**
    #   `Set-Cookie: __cf_bm=...`（机器人管理 cookie）。
    # 而 nginx 的默认规则是「响应含 Set-Cookie 就不缓存」。
    # 实测证据（2026-11-23）：
    #   · java.log 里 HIT 全部集中在 9/23，之后**再没有一次 HIT**，全是 MISS
    #   · 同一工件的两次连续请求都是 MISS，响应头里 Set-Cookie 恒在
    #   · 对比 maven.aliyun.com（不带 cookie）→ HIT 正常
    #
    # 公开制品不需要这个 cookie，忽略它即可恢复缓存。
    # （被忽略的 Set-Cookie 不会转发给客户端。）
    proxy_ignore_headers Set-Cookie;

    # ① 元数据与 SNAPSHOT：绝不缓存（必须放最前）
    location ~* (maven-metadata\.xml|-[0-9.]+-SNAPSHOT) {
        proxy_cache off;
        proxy_pass https://$host$request_uri;
    }

    # ② release 制品：1 天 TTL + **强制重验证**（自己验证，不赌上游承诺）
    #
    # Maven Central 的不可变承诺最强（Sonatype 服务端强制），但镜像站
    # （maven.aliyun.com 等）未必同样严格；且承诺是「正常情况」，不是保证。
    # 改成过期时条件请求：没变 304（0 字节），变了 200 自动更新。
    # ⚠️ 覆盖 server 级 use_stale 去掉 updating（旧副本 = 校验失败 = 装不上）。
    location ~* \.(jar|pom|war|aar|module|asc|sha1|md5)$ {
        proxy_cache_valid 200 302 1d;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_pass https://$host$request_uri;
    }

    # ③ 目录索引等其余：不缓存
    location / {
        proxy_cache off;
        proxy_pass https://$host$request_uri;
    }
}
