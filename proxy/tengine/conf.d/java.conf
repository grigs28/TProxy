# Java (Maven) 制品缓存
#
# ⚠️ 本文件的核心不是「能缓存什么」，而是「什么绝不能缓存」：
#
#   · maven-metadata.xml —— 版本清单，会随新版本发布而变
#   · *-SNAPSHOT*       —— 同一版本号的内容会被覆盖
#
# 一旦缓存它们，客户端将**永远解析不到新版本**，而且构建**不会报任何错**——
# 只会静默地一直使用旧依赖。这是本类型独有、且最难排查的失败模式。
#
# 因此：元数据与 SNAPSHOT 的 location 必须【排在 release 制品之前】
# （nginx 正则 location 按出现顺序匹配，先命中者胜出）。

server {
    listen 443 ssl;
    http2 on;
    server_name repo1.maven.org repo.maven.apache.org maven.aliyun.com;

    ssl_certificate     /etc/nginx/certs/$ssl_server_name.crt;
    ssl_certificate_key /etc/nginx/certs/$ssl_server_name.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/java.log main;
    client_max_body_size 0;
    proxy_connect_timeout 30s;
    proxy_read_timeout 1800s;
    proxy_set_header Host $host;
    proxy_ssl_server_name on;
    proxy_redirect off;
    proxy_cache mvn_cache;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_lock on;

    # ① 元数据与 SNAPSHOT：绝不缓存（必须放最前）
    location ~* (maven-metadata\.xml|-[0-9.]+-SNAPSHOT) {
        proxy_cache off;
        proxy_pass https://$host$request_uri;
    }

    # ② release 制品：长 TTL —— 坐标含版本号，内容永不改变
    location ~* \.(jar|pom|war|aar|module|asc|sha1|md5)$ {
        proxy_cache_valid 200 302 365d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_pass https://$host$request_uri;
    }

    # ③ 目录索引等其余：不缓存
    location / {
        proxy_cache off;
        proxy_pass https://$host$request_uri;
    }
}
