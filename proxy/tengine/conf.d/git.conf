# Git 智能 HTTP 代理
#
# ⚠️ 关键：git 的 /info/refs 与 /git-upload-pack 是【动态协商响应】——
# 客户端声明自己已有的对象，服务端实时计算 packfile，响应因请求而异。
# 若对它们启用 proxy_cache，会返回错误的 packfile（clone 出错误内容）。
# 这类响应绝不能缓存。
#
# 缓存由 gitcache 自身负责（它在本地维护裸仓库镜像），tengine 层不叠加。

server {
    listen 443 ssl;
    http2 on;
    server_name github.com gitlab.com gitee.com;

    ssl_certificate     /etc/nginx/certs/$ssl_server_name.crt;
    ssl_certificate_key /etc/nginx/certs/$ssl_server_name.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/git.log main;
    client_max_body_size 0;

    proxy_connect_timeout 30s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_ssl_server_name on;

    # git 协议端点 → 本机 gitcache
    #
    # ⚠️ 必须在路径前补上 $host —— gitcache 期望的格式是
    #     http://<cache>:4999/<域名>/<owner>/<repo>
    #   而客户端发来的是 /<owner>/<repo>。缺少域名前缀时 gitcache 会把
    #   "owner/repo/info" 整段当成仓库名，触发 parseHttpParams panic。
    #
    # 响应为动态协商内容（含 packfile），明确关闭缓存。
    location ~ ^/[^/]+/[^/]+(\.git)?/(info/refs|git-upload-pack|git-receive-pack) {
        proxy_pass http://127.0.0.1:4999/$host$request_uri;
        proxy_set_header Host $host;
        proxy_cache off;
    }

    # 其余（网页浏览、Release 静态文件等）→ 直连上游
    # gitcache 不是网页服务器，若把它也交给 gitcache 会得到 502
    location / {
        proxy_pass https://$host$request_uri;
        proxy_cache off;
    }
}
