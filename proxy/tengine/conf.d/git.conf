# Git 智能 HTTP 代理
#
# 三类流量，去向不同：
#
#   1. 匿名只读（非 push、无 Authorization）→ 走本机缓存层（smart-git :8080）
#   2. push（git-receive-pack）            → **直连上游**
#   3. 带 Authorization                    → **直连上游**
#
# 为什么 2/3 必须直连：
#
#   · push —— 缓存层不支持写协议。smart-git 明确返 403
#     （`remote: Invalid service, Only Smart HTTP`），而 gitcache 会让 git
#     卡在认证提示（`could not read User Name`）。
#
#   · 带凭据 —— 共享缓存**不校验凭据**：首次带 token clone 私有仓库后，
#     裸仓库镜像留在本地，任何内网客户端之后都能无凭据 clone 到全部内容。
#     必须让有凭据的流量绕过共享缓存。
#
# 这两条由下方 map 静态求值决定上游，避免 location 内的 if（nginx "if is evil"）。

# 是否为 push 相关请求
map $request_uri $git_is_push {
    ~git-receive-pack   1;
    default             0;
}

# 是否携带凭据
map $http_authorization $git_has_auth {
    ""      0;
    default 1;
}

# 缓存层要的路径形态 —— **要去掉 `.git` 后缀**。
#
# smart-git 的仓库路径是 `/<owner>/<repo>`（它自己去上游时补 `.git`），
# 而客户端给的是 `/<owner>/<repo>.git/...`。
# 实测：给成 `log-ui.git` 它会去请求 `https://github.com/.../log-ui.git.git`，
# 然后 500。
#
# 原 gitcache 相反 —— 它要 `/<域名>/<owner>/<repo>`（含域名前缀），
# 少了前缀会把整段当仓库名解析并 panic。两个缓存层的 URL 约定不同，换组件时
# 这里是最容易踩的地方。
map $request_uri $git_cache_uri {
    ~^/([^/]+)/([^/]+?)\.git(/.*)$   /$1/$2$3;
    default                          $request_uri;
}

# 哪些域名可以走缓存层。
#
# ⚠️ **只有 github.com** —— 缓存层（smart-git）的上游地址是**写死的**
#    `https://github.com`。gitlab / gitee 送进去它只会去 github 找同名仓库、
#    失败、再回落 —— 白白多一次回源。
#
#    更要紧的是：那个回落对 **POST 是无效的**。本 server 段开了
#    `proxy_request_buffering off`（push 要流式转发，不能先缓冲整个包），
#    而 `error_page` 触发内部重定向时**要重放请求体** —— 体已经流走了，
#    重放的是个空体，上游直接关连接 → **502**。
#    实测：gitlab.com 的 `info/refs`(GET) 能回落成功，但
#    `git-upload-pack`(POST) 必 502。
#
#    所以非 github 域名**根本不该进缓存分支**，从一开始就直连。
map $host $git_cacheable {
    github.com   1;
    default      0;
}

# 组合决策上游：
#   1xx（github 且匿名且非 push）→ 走本机缓存层；其余一律直连上游
map "$git_cacheable$git_is_push$git_has_auth" $git_target {
    "100"   "http://127.0.0.1:8080$git_cache_uri";
    default "https://$host$request_uri";
}

server {
    listen 443 ssl;
    http2 on;
    server_name github.com gitlab.com gitee.com;

    ssl_certificate     /etc/nginx/certs/$ssl_server_name.crt;
    ssl_certificate_key /etc/nginx/certs/$ssl_server_name.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/git.log main;
    client_max_body_size 0;

    proxy_connect_timeout 30s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_ssl_server_name on;

    # ⚠️ 必须显式 1.1。`proxy_pass` 默认用 **HTTP/1.0** 与上游通信，
    #    而缓存层（smart-git）是 Go net/http，按 1.1 写。
    #    更关键的是本段开了 `proxy_request_buffering off`（请求体**流式**转发，
    #    push 不能先缓冲整包）—— 而 HTTP/1.0 无法分块编码传输未知长度的体。
    #    实测症状：缓存层日志显示那条 POST 是 **200 成功**的，但客户端收到的是
    #    **自己的请求体回显 + `500 ` 残片** →
    #    `致命错误：协议错误：错误的行长度字符串：500`。
    #    直接对缓存层发同一个请求则完全正常 —— 说明是 tengine 这一段弄坏的。
    proxy_http_version 1.1;

    # git 协议端点。
    # 正则用 .+ 而非 [^/]+/[^/]+ —— 后者只接受两段路径，
    # 会漏掉 GitLab 的子组仓库（/group/sub/repo.git/...），
    # 那些请求会静默落到下面的 location / 失去缓存。
    # ⚠️ **回落只能给 `info/refs`** —— 它是 GET、没有请求体，重放才安全。
    #
    # 为什么需要回落：git **只在收到 401 挑战时才发送凭据**。私有仓库走缓存层时，
    # 缓存层自己匿名去请求上游、拿不到，返回的是**非 401 的错误**（smart-git 返 500）
    # —— git 于是永远不发凭据。回落直连后真 GitHub 回 **401** → 凭据才发得出来。
    # 实测对照（同一台机、同一个私有仓库 grigs28/sxbot）：
    #   gitcache  匿名 → 200 + "Repository not found."  → git 静默、退出码 0
    #   smart-git 匿名 → 500 + authentication required  → git 报错（可见）
    #   真 GitHub      → 401                            → git 发凭据 ✓
    #
    # 为什么**不能**给 POST 端点：本 server 段开了 `proxy_request_buffering off`
    # （push 要流式转发），而 `error_page` 触发内部重定向时**要重放请求体** ——
    # 体已经流走上游了，重放的是残留字节。
    # 实测症状（`.14` 上 `git fetch` 一个已有仓库）：
    #   客户端把自己的请求体当成响应读了回来，紧接着是 `500 ` 的残片 →
    #   `致命错误：协议错误：错误的行长度字符串：500`
    # 而缓存层日志显示那条 POST 其实是 **200 成功**的 —— 是 tengine 这一段弄坏的。
    location ~ ^/.+/(info/refs)$ {
        proxy_pass $git_target;
        proxy_cache off;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @git_direct;
    }

    # 其余 git 协议端点（git-upload-pack / git-receive-pack）。
    # **不设回落** —— POST 有请求体，重放会坏（见上）。
    location ~ ^/.+/(git-upload-pack|git-receive-pack)$ {
        proxy_pass $git_target;
        proxy_cache off;
    }

    # 其余（网页浏览、Release 静态文件等）→ 直连上游
    location / {
        proxy_pass https://$host$request_uri;
        proxy_cache off;
    }

    # 缓存层 5xx 时的落点。
    # ⚠️ 这里**不设** proxy_intercept_errors（沿用默认 off）——
    #    否则直连上游再返 5xx 时会回到自己，形成内部重定向自环。
    location @git_direct {
        proxy_pass https://$host$request_uri;
        proxy_cache off;
    }
}
