# Git 智能 HTTP 代理
#
# 只有【匿名只读】流量才走本机 gitcache 缓存。另外两类必须直连上游：
#
#   1. push（git-receive-pack）—— gitcache 根本不支持该协议：
#      其 receive-pack 分支对远端发的是 GET、不转发请求体、不回写响应体。
#      若路由给它，全内网所有 git push 都会失败，且报错形态是协议层异常。
#
#   2. 带 Authorization 的请求 —— gitcache 的缓存命中路径【不校验凭据】，
#      首次带 token clone 私有仓库后，裸仓库镜像留在本地，任何内网客户端
#      之后都能无凭据 clone 到全部内容。必须让有凭据的流量绕过共享缓存。
#
# 这两条由下方两个 map 静态求值决定上游，避免 location 内的 if（nginx "if is evil"）。

# 是否为 push 相关请求
map $request_uri $git_is_push {
    ~git-receive-pack   1;
    default             0;
}

# 是否携带凭据
map $http_authorization $git_has_auth {
    ""      0;
    default 1;
}

# 组合决策上游：
#   "00" 匿名且非 push → 走本机缓存；其余一律直连上游
map "$git_is_push$git_has_auth" $git_target {
    "00"    "http://127.0.0.1:4999/$host";
    default "https://$host";
}

server {
    listen 443 ssl;
    http2 on;
    server_name github.com gitlab.com gitee.com;

    ssl_certificate     /etc/nginx/certs/$ssl_server_name.crt;
    ssl_certificate_key /etc/nginx/certs/$ssl_server_name.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/git.log main;
    client_max_body_size 0;

    proxy_connect_timeout 30s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_ssl_server_name on;

    # git 协议端点。
    # 正则用 .+ 而非 [^/]+/[^/]+ —— 后者只接受两段路径，
    # 会漏掉 GitLab 的子组仓库（/group/sub/repo.git/...），
    # 那些请求会静默落到下面的 location / 失去缓存。
    #
    # ⚠️ gitcache 期望 URL 带域名前缀 /<域名>/<owner>/<repo>，故 $git_target
    #    的缓存分支里已含 $host。缺少前缀时 gitcache 会把 "owner/repo/info"
    #    整段当成仓库名解析并 panic。
    location ~ ^/.+/(info/refs|git-upload-pack|git-receive-pack)$ {
        proxy_pass $git_target$request_uri;
        proxy_cache off;
    }

    # 其余（网页浏览、Release 静态文件等）→ 直连上游
    location / {
        proxy_pass https://$host$request_uri;
        proxy_cache off;
    }
}
