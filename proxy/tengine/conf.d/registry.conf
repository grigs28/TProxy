# Docker 镜像缓存分流
#
# 与其它类型的区别：registry:2 的 proxy 模式【自带缓存】（落盘在 /var/lib/registry），
# 所以 tengine 层不再叠加 proxy_cache —— 只做 TLS 终结 + 转发，避免双层缓存冗余
# 与不一致。
#
# 用 map 而非 location 内的 if：nginx 的 if 是 "evil"（配置在 if 内行为易出错），
# map 是静态求值、更可靠。

# 每个被劫持的仓库域名都映射到对应的本机 registry 实例。
# 若某域名无缓存实例，应同时从 dnsmasq 劫持清单和下方 server_name 中移除 ——
# 否则只有 MITM 成本没有缓存收益。
map $host $docker_upstream {
    registry-1.docker.io   http://127.0.0.1:5001;
    quay.io                http://127.0.0.1:5000;
    gcr.io                 http://127.0.0.1:5002;
    ghcr.io                http://127.0.0.1:5003;
    registry.k8s.io        http://127.0.0.1:5005;
    k8s.gcr.io             http://127.0.0.1:5005;   # 废弃域名，共用实例
    mcr.microsoft.com      http://127.0.0.1:5006;
    default                https://$host;
}

server {
    listen 443 ssl;
    http2 on;
    server_name registry-1.docker.io auth.docker.io
                production.cloudflare.docker.com
                quay.io gcr.io ghcr.io k8s.gcr.io
                registry.k8s.io mcr.microsoft.com;

    ssl_certificate     /etc/nginx/certs/$ssl_server_name.crt;
    ssl_certificate_key /etc/nginx/certs/$ssl_server_name.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/registry.log main;
    client_max_body_size 0;

    # 镜像层动辄数百 MB，超时必须放宽，否则缓存会写入半截文件
    proxy_connect_timeout 30s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;

    proxy_set_header Host $host;
    proxy_ssl_server_name on;
    proxy_redirect off;
    proxy_http_version 1.1;

    location /v2/ {
        proxy_pass $docker_upstream$request_uri;
        proxy_cache off;
        # 镜像层是流式大文件，关闭缓冲避免落盘两遍
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass https://$host$request_uri;
        proxy_cache off;
    }
}
