# Python (PyPI) 缓存
#
# 与系统包同理：索引会更新（短 TTL），包文件内容寻址（长 TTL）。

server {
    listen 443 ssl;
    http2 on;
    server_name pypi.org files.pythonhosted.org pypi.tuna.tsinghua.edu.cn;

    ssl_certificate     /etc/nginx/certs/$ssl_server_name.crt;
    ssl_certificate_key /etc/nginx/certs/$ssl_server_name.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/python.log main;
    client_max_body_size 0;
    proxy_connect_timeout 30s;
    proxy_read_timeout 1800s;
    proxy_set_header Host $host;
    proxy_ssl_server_name on;
    proxy_redirect off;
    proxy_cache py_cache;
    # 纳入 Accept：PyPI 按 PEP 691 可返回 JSON 或 HTML 两种索引变体，
    # 不区分会让先缓存的那一种发给所有客户端
    proxy_cache_key "$scheme$host$request_uri|$http_accept";
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # 强制明文，消除 gzip 变体问题（内网带宽不是瓶颈）
    proxy_set_header Accept-Encoding "";

    # simple 索引：短 TTL —— 新版本发布必须及时可见
    location ~ ^/simple/ {
        proxy_cache_valid 200 302 5m;
        proxy_pass https://$host$request_uri;
    }

    # 包文件：1 天 TTL + **强制重验证**（自己验证，不赌上游承诺）
    #
    # 原先是 365d，建立在「包文件不可变」的假设上。但这个假设只是**上游承诺**：
    #   · PyPI 服务端拒绝同名覆盖        —— 较强，但账号被盗后可删掉重发
    #   · npm 有 72 小时 unpublish 窗口  —— 更弱
    #   · openEuler 已实测**会原地重建** —— 完全没有承诺
    # 一旦承诺被打破，365d 意味着客户端要卡**一整年**（2026-11 的 sssd 事件就是这样）。
    #
    # 改成过期时带 If-Modified-Since / If-None-Match 回源：
    #   · 上游没变 → 304（0 字节），续用缓存，成本≈0
    #   · 上游变了 → 200 + 新文件，自动更新
    # 实测 PyPI / npm / Maven 的响应都带 ETag 与 Last-Modified，支持条件请求。
    #
    # ⚠️ 覆盖 server 级 use_stale，去掉 `updating`：
    #    那个会让过期后首个客户端拿到旧副本，而带 hash 校验的客户端拿到旧副本
    #    等于直接装不上 —— 正确性优先于那一次可用性。
    location ~* \.(whl|tar\.gz|zip|egg)$ {
        proxy_cache_valid 200 302 1d;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_pass https://$host$request_uri;
    }

    location / {
        proxy_cache_valid 200 302 10m;
        proxy_pass https://$host$request_uri;
    }
}
