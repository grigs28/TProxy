user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /usr/local/tengine/logs/error.log warn;

events {
    worker_connections  4096;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # DNS 指向宿主机的 Dnsmasq
    resolver 127.0.0.1:53 valid=300s ipv6=off;
    resolver_timeout 5s;

    # 日志格式
    log_format cache '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_host" $upstream_cache_status '
                    'rt=$request_time uct="$upstream_connect_time"';

    access_log /usr/local/tengine/logs/access.log cache;

    # HDD 缓存配置（使用容器内路径）
    proxy_cache_path /data/cache levels=1:2 keys_zone=cache_zone:512m max_size=1800g inactive=30d use_temp_path=off;

    # 代理超时设置
    proxy_connect_timeout  20s;
    proxy_read_timeout     60s;
    proxy_send_timeout     60s;

    # HTTP/HTTPS 代理服务器
    server {
        listen 3128;

        # 启用 CONNECT 方法
        proxy_connect;
        proxy_connect_allow 443 80 8080 8443;

        # 缓存配置
        proxy_cache cache_zone;
        proxy_cache_valid 200 206 301 302 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503;

        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        proxy_cache_key $scheme$proxy_host$uri$is_args$args;

        # 安全头部处理
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location / {
            proxy_pass http://$http_host$request_uri;
            proxy_set_header Host $http_host;
            proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie;
        }
    }

    # 状态监控页
    server {
        listen 8088;
        location /status {
            stub_status on;
            access_log off;
            allow 192.168.91.0/24;
            allow 192.168.92.0/24;
            allow 192.168.93.0/24;
            allow 192.168.94.0/24;
            deny all;
        }
    }
}
