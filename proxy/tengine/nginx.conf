user root;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 0;

    # 上游域名解析必须用公共 DNS，不能用本机 dnsmasq ——
    # 本机 dnsmasq 已把上游域名劫持到 192.168.0.18，用它解析会解析回代理自身，形成死循环。
    #
    # ⚠️ **必须多配几台、且跨厂商。** nginx 的 resolver 是它**自己实现**的 DNS 客户端
    #    （不用系统 libc），超时后会在下面这些服务器之间**轮换重试**。
    #    只配 2 台且都是阿里时，阿里那条路抖一下就全挂 —— 实测 2026-10-16：
    #    git 请求 786 次里 502 有 29 次（≈3.7%），错误日志全是
    #      `github.com could not be resolved (110: Operation timed out)`
    #    而**同一时刻**同一台机器上 `getent` / `dig` / `curl` 解析 github.com 全部正常
    #    —— 因为那些走 libc，会自动重试换服务器，你根本看不见丢包。
    #
    #    5 台覆盖 4 家（阿里 / 腾讯 / 114 / 百度）：任一家路径抖动时还有别家可用。
    #    `ipv6=off` 保留：本机无 IPv6 出口（实测 0 个全局地址），解析出 AAAA 只会白等。
    #
    #    注意：这**不能**根治。若丢包来自 .18 出网链路的某一跳，所有服务器都受影响，
    #    仍会有零星失败 —— 真要根治得抓包定位那一跳。
    resolver 223.5.5.5 223.6.6.6 119.29.29.29 114.114.114.114 180.76.76.76 valid=300s ipv6=off;
    # 5s → 10s：给轮换重试留出更多时间窗口（默认 5s 对 5 台轮询偏紧）
    resolver_timeout 10s;

    # ---- 缓存区：系统包 ----
    proxy_cache_path /var/cache/tproxy/os levels=1:2 keys_zone=os_cache:100m
                     max_size=500g inactive=60d use_temp_path=off;

    # Python (PyPI)
    proxy_cache_path /var/cache/tproxy/python levels=1:2 keys_zone=py_cache:50m
                     max_size=100g inactive=60d use_temp_path=off;

    # Node.js (npm)
    proxy_cache_path /var/cache/tproxy/nodejs levels=1:2 keys_zone=npm_cache:50m
                     max_size=100g inactive=60d use_temp_path=off;

    # Java (Maven)
    proxy_cache_path /var/cache/tproxy/java levels=1:2 keys_zone=mvn_cache:50m
                     max_size=100g inactive=60d use_temp_path=off;

    # 回源默认行为
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # 加大响应头缓冲：GitHub 首页等站点的响应头远超 nginx 默认 4k，
    # 会报 "upstream sent too big header while reading response header" 并返回 502
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    proxy_busy_buffers_size 32k;

    include /etc/nginx/conf.d/*.conf;
}
