user root;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 0;

    # 上游域名解析必须用公共 DNS，不能用本机 dnsmasq ——
    # 本机 dnsmasq 已把上游域名劫持到 192.168.0.18，用它解析会解析回代理自身，形成死循环。
    # 223.5.5.5 不受本机劫持影响，可拿到真实 IP。
    resolver 223.5.5.5 223.6.6.6 valid=300s ipv6=off;
    resolver_timeout 5s;

    # ---- 缓存区：系统包 ----
    proxy_cache_path /var/cache/tproxy/os levels=1:2 keys_zone=os_cache:100m
                     max_size=500g inactive=60d use_temp_path=off;

    # 回源默认行为
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # 加大响应头缓冲：GitHub 首页等站点的响应头远超 nginx 默认 4k，
    # 会报 "upstream sent too big header while reading response header" 并返回 502
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    proxy_busy_buffers_size 32k;

    include /etc/nginx/conf.d/*.conf;
}
