# ---- 例外：github.com 的子域（只劫持主机名本身，子域放行）----
#
# ⚠️ `address=/github.com/` **连子域一起匹配**（dnsmasq 的语义）—— 本意是
#    「劫持 git 仓库主机」，但 cli / api / codeload / ssh / gist 这些子域
#    也一并被吞了。而 tengine **只服务 github.com 本身**
#    （见 tengine/conf.d/git.conf 的 server_name）。
#
#    劫持了却不服务 = **纯 MITM 成本，还把机器弄坏**。这正是
#    tengine/conf.d/registry.conf 里写的那条原则的另一面：
#    「若某域名无缓存实例，应同时从 dnsmasq 劫持清单和 server_name 中移除」。
#
#    实测（2026-09-24，.14）：dnf 的 gh-cli 源
#    （https://cli.github.com/packages/rpm）报
#      Curl error (35): SSL connect error ... tlsv1 alert internal error
#    —— 就是被劫持到 .18 后 tengine 拿不出匹配的证书。
#
# dnsmasq 里**更具体的域名优先**，下面几条会盖过 address=/github.com/，
# 让它们走正常上游解析（.18 自己也是这么解析的，实测拿到真实 IP）。
#
# ⚠️ 以后工具用到别的 *.github.com 子域，同样要加在这里 —— 否则症状相同。
# ⚠️ 但若该子域**已被 tengine 服务**，就该反过来从例外里移掉、加进上面的劫持段
#    （cli.github.com 就是这样：先放行，加上服务块后又移回劫持）。
# ⚠️ 用**显式上游**，不要写 `server=/域名/#`。
#    实测 `#`（手册说「用默认服务器」）会连带把 address=/github.com/ 的语义带偏 ——
#    github.com 本身开始从**上游缓存**答（日志里是 `cached github.com is 140.82.116.3`），
#    劫持整个失效。换成两个具体上游就正常。
server=/api.github.com/223.5.5.5
server=/api.github.com/223.6.6.6
server=/codeload.github.com/223.5.5.5
server=/codeload.github.com/223.6.6.6
server=/ssh.github.com/223.5.5.5
server=/ssh.github.com/223.6.6.6
server=/gist.github.com/223.5.5.5
server=/gist.github.com/223.6.6.6

