# TProxy dnsmasq 配置
# 职责：域名劫持 → 本机；内网域名解析；未命中劫持的转发上游

listen-address=0.0.0.0
bind-interfaces
port=53

# ---- 上游 DNS ----
# 禁用 202.99.192.68（山西联通）：延迟虽低但存在劫持/污染，见 spec §4.3
server=223.5.5.5
server=223.6.6.6
no-resolv
no-poll

cache-size=10000
min-cache-ttl=300

log-queries
log-facility=-

# ---- 内网域名 ----
# 并行双 IP，防单点临时故障。
# 必须用 addn-hosts：address= 只支持单地址，host-record 也只支持单个 IPv4，
# 只有 hosts 文件里同名多行才能返回多条 A 记录。
addn-hosts=/etc/dnsmasq-hosts

# ---- 系统包仓库劫持 ----
# openEuler
address=/repo.openeuler.org/192.168.0.18
address=/mirrors.openeuler.org/192.168.0.18
address=/dl-cdn.openeuler.openatom.cn/192.168.0.18
# Ubuntu
address=/archive.ubuntu.com/192.168.0.18
address=/security.ubuntu.com/192.168.0.18
address=/cn.archive.ubuntu.com/192.168.0.18
address=/ports.ubuntu.com/192.168.0.18
# Debian（PVE 机群全靠它 —— 实测 16 台在用，此前一直在直连、没走缓存）
address=/deb.debian.org/192.168.0.18
address=/security.debian.org/192.168.0.18
# Proxmox（PVE/PBS/Ceph，实测 14 台；原由 repair.sh 补的源指向这里）
address=/download.proxmox.com/192.168.0.18
# CentOS / EPEL
address=/mirror.centos.org/192.168.0.18
address=/mirrorlist.centos.org/192.168.0.18
address=/dl.fedoraproject.org/192.168.0.18
address=/mirrors.fedoraproject.org/192.168.0.18
# 国内镜像站
