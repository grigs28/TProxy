# TProxy dnsmasq 配置
# 职责：域名劫持 → 本机；内网域名解析；未命中劫持的转发上游

listen-address=0.0.0.0
bind-interfaces
port=53

# ---- 上游 DNS ----
# 禁用 202.99.192.68（山西联通）：延迟虽低但存在劫持/污染，见 spec §4.3
server=223.5.5.5
server=223.6.6.6
no-resolv
no-poll

cache-size=10000
min-cache-ttl=300

log-queries
log-facility=-

# ---- 内网域名 ----
# 并行双 IP，防单点临时故障。
# 必须用 addn-hosts：address= 只支持单地址，host-record 也只支持单个 IPv4，
# 只有 hosts 文件里同名多行才能返回多条 A 记录。
addn-hosts=/etc/dnsmasq-hosts

# ==== 域名劫持区 ====
#
# ⚠️ 总则：每个域名必须 **address= 与 local= 成对**出现，缺一不可。
#
#      address=/域名/IP   提供 A 记录 —— 劫持生效
#      local=/域名/       令 dnsmasq 自认权威、**永不转发**
#
#   只写 address= 会有一个致命缺陷：它**只提供 A 记录**。客户端查 AAAA 时
#   （glibc 的 getaddrinfo 默认 A 与 AAAA 并行发送，所以这几乎必然发生）
#   dnsmasq 无 AAAA 可答 → **转发上游** → 上游回复里该域名是条 **CNAME** →
#   客户端**追链**去查 CNAME 目标 → 把目标的真实 A 记录灌进缓存 →
#   而 **CNAME 是类型无关的**，此后连 A 查询也命中它 → **劫持彻底失效**。
#
#   实测（2026-09-26）：44 个劫持域名中 **17 个**真实是 CNAME，
#   全都会被一次追链打穿；生产上 `deb.debian.org`（16 台机器在用）已经中招。
#   回归测试：tests/test-dns-poison.sh（自带 dnsmasq 实例，不碰生产缓存）
#
# ---- 系统包仓库劫持 ----
