# TProxy 核心代理层
# dnsmasq: 域名劫持 + 内网解析 + 上游兜底
# tengine: 80/443 入口 + TLS 终结 + 按 Host 分流 + proxy_cache
services:
  dnsmasq:
    build:
      context: ./dnsmasq
      dockerfile: Dockerfile
    image: tproxy/dnsmasq:local
    container_name: v3-dnsmasq
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ./dnsmasq/hosts:/etc/dnsmasq-hosts:ro
    healthcheck:
      test: ["CMD", "nslookup", "localhost", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 3

  tengine:
    image: nginx:alpine
    container_name: v3-tengine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./tengine/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tengine/conf.d:/etc/nginx/conf.d:ro
      - ./ca/certs:/etc/nginx/certs:ro
      # 根 CA 供客户端下载（client-setup.sh 请求 /tproxy-ca.crt）
      - ./ca/tproxy-ca.crt:/usr/share/nginx/tproxy-ca.crt:ro
      - ${CACHE_BASE}/nginx:/var/cache/tproxy
      - ./logs/tengine:/var/log/nginx
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      # 两点都重要：
      # 1) 用 127.0.0.1 而非 localhost —— 容器内 localhost 解析到 ::1，nginx 只监听 IPv4
      # 2) 打 /healthz 而非 / —— 根路径的 Host 不匹配任何 server_name，
      #    会落到兜底块（return 444），健康检查会失败
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Docker Hub 镜像缓存。
  # 用 host 网络且监听 127.0.0.1:5001 —— 只对 tengine 暴露，不占公网端口。
  # 注意：REGISTRY_HTTP_ADDR 与访问地址必须一致。旧环境曾把容器内地址写成 5001
  # 却用 ports "5001:5000" 映射到无人监听的 5000，导致 6/7 个 registry 全部不可达。
  registry-docker:
    image: registry:2
    container_name: v3-reg-docker
    restart: unless-stopped
    network_mode: host
    environment:
      - REGISTRY_PROXY_REMOTEURL=https://registry-1.docker.io
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry
      - REGISTRY_HTTP_ADDR=127.0.0.1:5001
      - REGISTRY_HTTP_SECRET=${REGISTRY_HTTP_SECRET}
    volumes:
      - ${CACHE_BASE}/registry/docker:/var/lib/registry
    dns:
      - 223.5.5.5
      - 223.6.6.6
    healthcheck:
      # /v2/ 对无凭据请求返回 401 —— 那是存活证据，不是失败。
      # 用退出码判断而非状态码，故接受任何 HTTP 响应。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5001/v2/ || [ $? -eq 8 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 其余上游的缓存实例。
  # 每个被劫持的仓库域名都应有对应的 registry ——
  # 否则就是「纯 MITM 成本、零缓存收益」，且 .18 出网中断时无兜底。
  registry-quay:
    image: registry:2
    container_name: v3-reg-quay
    restart: unless-stopped
    network_mode: host
    environment:
      - REGISTRY_PROXY_REMOTEURL=https://quay.io
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry
      - REGISTRY_HTTP_ADDR=127.0.0.1:5000
      - REGISTRY_HTTP_SECRET=${REGISTRY_HTTP_SECRET}
    volumes:
      - ${CACHE_BASE}/registry/quay:/var/lib/registry
    dns:
      - 223.5.5.5
      - 223.6.6.6

  registry-gcr:
    image: registry:2
    container_name: v3-reg-gcr
    restart: unless-stopped
    network_mode: host
    environment:
      - REGISTRY_PROXY_REMOTEURL=https://gcr.io
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry
      - REGISTRY_HTTP_ADDR=127.0.0.1:5002
      - REGISTRY_HTTP_SECRET=${REGISTRY_HTTP_SECRET}
    volumes:
      - ${CACHE_BASE}/registry/gcr:/var/lib/registry
    dns:
      - 223.5.5.5
      - 223.6.6.6

  registry-ghcr:
    image: registry:2
    container_name: v3-reg-ghcr
    restart: unless-stopped
    network_mode: host
    environment:
      - REGISTRY_PROXY_REMOTEURL=https://ghcr.io
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry
      - REGISTRY_HTTP_ADDR=127.0.0.1:5003
      - REGISTRY_HTTP_SECRET=${REGISTRY_HTTP_SECRET}
    volumes:
      - ${CACHE_BASE}/registry/ghcr:/var/lib/registry
    dns:
      - 223.5.5.5
      - 223.6.6.6

  registry-k8s-io:
    image: registry:2
    container_name: v3-reg-k8s-io
    restart: unless-stopped
    network_mode: host
    environment:
      - REGISTRY_PROXY_REMOTEURL=https://registry.k8s.io
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry
      - REGISTRY_HTTP_ADDR=127.0.0.1:5005
      - REGISTRY_HTTP_SECRET=${REGISTRY_HTTP_SECRET}
    volumes:
      - ${CACHE_BASE}/registry/k8s-io:/var/lib/registry
    dns:
      - 223.5.5.5
      - 223.6.6.6

  # k8s.gcr.io 是废弃域名（会 302 到 registry.k8s.io），复用该实例即可，
  # 不单独占用端口；registry.conf 里由 map 处理。
  registry-mcr:
    image: registry:2
    container_name: v3-reg-mcr
    restart: unless-stopped
    network_mode: host
    environment:
      - REGISTRY_PROXY_REMOTEURL=https://mcr.microsoft.com
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry
      - REGISTRY_HTTP_ADDR=127.0.0.1:5006
      - REGISTRY_HTTP_SECRET=${REGISTRY_HTTP_SECRET}
    volumes:
      - ${CACHE_BASE}/registry/mcr:/var/lib/registry
    dns:
      - 223.5.5.5
      - 223.6.6.6

  # git 仓库缓存。本地构建（Go 编译），首次 up 需数分钟。
  # 监听 127.0.0.1:4999，只对 tengine 暴露。
  gitcache:
    build:
      context: ./gitcache
      dockerfile: Dockerfile
    image: tproxy/gitcache:local
    container_name: v3-gitcache
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${CACHE_BASE}/git:/var/gitcache
    command: ["-b", "/var/gitcache", "-p", "4999"]
    dns:
      - 223.5.5.5
      - 223.6.6.6

  # 统一管理界面。
  # 配置与缓存均【只读挂载】—— 界面只做展示与诊断，不直接写文件，
  # 避免与运维手工编辑互相覆盖。
  manager:
    build:
      context: ../manager
      dockerfile: Dockerfile
    image: tproxy/manager:local
    container_name: v3-manager
    restart: unless-stopped
    network_mode: host
    environment:
      - TPROXY_CACHE_BASE=${CACHE_BASE}
      - TPROXY_CONF_D=/opt/TProxy/proxy/tengine/conf.d
      - TPROXY_DNSMASQ_CONF=/opt/TProxy/proxy/dnsmasq/dnsmasq.conf
      - TPROXY_CERTS_DIR=/opt/TProxy/proxy/ca/certs
      - TPROXY_LOG_DIR=/var/log/nginx
      # ---- SSO 认证 ----
      # 管理端接 yz-login 统一登录，且只放行 is_admin==1 的账号。
      # 因此可以对内网开放，而不必再靠绑回环保护。
      - YZ_LOGIN_URL=${YZ_LOGIN_URL:-http://192.168.0.8}
      # 用应用引用而非硬编码回调 URL：在 yz-login 后台改地址时自动跟随
      - YZ_APP_REF=${YZ_APP_REF:-id:55}
      - MANAGER_BIND=0.0.0.0
      - MANAGER_STATE_DIR=/var/lib/tproxy-manager
      # MANAGER_SECRET_KEY 未设置时会自动生成并持久化到 MANAGER_STATE_DIR，
      # 既不随代码入库、容器重启也不掉登录态
    volumes:
      # ---- 只读 ----
      - ${CACHE_BASE}:${CACHE_BASE}:ro
      - ./logs/tengine:/var/log/nginx:ro            # 命中率统计的数据来源
      - ./tengine/nginx.conf:/opt/TProxy/proxy/tengine/nginx.conf:ro
      # ---- 可写：仅新增上游需要改的那三处 ----
      # ⚠️ ca 目录含根 CA 私钥 —— 签发域名证书必须用它，故不得不给写权限。
      #    这意味着容器若被攻破即可伪造任意站点证书；SSO 的管理员限制是唯一屏障。
      #    若要进一步收紧，可把签发动作移到宿主机、界面只负责触发。
      - ./dnsmasq:/opt/TProxy/proxy/dnsmasq:rw
      - ./tengine/conf.d:/opt/TProxy/proxy/tengine/conf.d:rw
      - ./ca:/opt/TProxy/proxy/ca:rw
      # session 密钥等运行态数据
      - ${CACHE_BASE}/manager:/var/lib/tproxy-manager:rw
