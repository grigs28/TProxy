services:
  generator:
    image: python:3.11-alpine
    container_name: proxy-generator
    restart: unless-stopped
    network_mode: host
    volumes:
      - /mnt/HDD/TProxy:/data:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - MASTER_FILE=/data/hosts-master.txt
      - OUTPUT_DIR=/data/generated
      - LOG_DIR=/data/logs
      - CACHE_BASE=/data/cache
      - DNSMASQ_CONTAINER=dnsmasq
      - TENGINE_CONTAINER=tengine
      - PROXY_HOST=192.168.0.36
      - PROXY_HOST_PORT=3128
      - STATUS_HOST_PORT=8088
      - CHECK_INTERVAL=5
    command: >
      sh -c "
      pip install docker -q &&
      python3 /data/generator.py
      "
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dnsmasq:
    image: alpine:3.19
    container_name: dnsmasq
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /mnt/HDD/TProxy:/data:rw
    command: sh -c "apk add --no-cache dnsmasq && dnsmasq --keep-in-foreground --conf-file=/data/generated/dnsmasq.conf"
    depends_on:
      - generator
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tengine:
    build: ./tengine
    image: local/tengine:3.1.0-proxy
    container_name: tengine
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    user: root
    volumes:
      - /mnt/HDD/TProxy/generated/tengine:/usr/local/tengine/conf/generated:ro
      - /mnt/HDD/TProxy/cache:/data/cache:rw
      - /mnt/HDD/TProxy/logs:/usr/local/tengine/logs:rw
    depends_on:
      - generator
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    command: >
      sh -c "
      cat /usr/local/tengine/conf/generated/nginx.conf > /usr/local/tengine/conf/nginx.conf &&
      /usr/local/tengine/sbin/nginx -g 'daemon off;'
      "
