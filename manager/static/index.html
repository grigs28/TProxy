<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TProxy 缓存管理</title>
<style>
  /* ---- 设计令牌 ----
     配色取自主题本身：这是「劫持与流向」的世界，
     深蓝灰底而非纯黑（长时间盯屏不刺眼），青色作交互色，
     三个状态色承担全部语义。 */
  :root {
    --bg:      #0f1419;
    --surface: #161c24;
    --raise:   #1d252f;
    --border:  #2b3542;
    /* 文字对比度（在 --bg 上）：
       text ~15.5:1 / muted ~8.2:1 / faint ~4.9:1
       原先 faint 只有 ~2.3:1，表头和标签几乎看不清，故整体提亮 */
    --text:    #e9eef6;
    --muted:   #a3b0c2;
    --faint:   #8d9aac;
    --accent:  #5ad2f4;
    --ok:      #4ade80;
    --warn:    #fbbf24;
    --bad:     #f87171;

    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;

    --gap: 20px;
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px 64px;
  }

  /* ---- 顶栏 ---- */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
  }
  h1 .sub {
    color: var(--faint);
    font-weight: 400;
    margin-left: 8px;
    font-size: 15px;
  }
  .host {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 15px;
    color: var(--muted);
  }
  .sep { color: var(--faint); }
  .ver {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--faint);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 6px;
    margin-left: 10px;
    font-weight: 400;
    letter-spacing: 0;
  }
  .user {
    color: var(--text);
    max-width: 12em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .logout {
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 10px;
    font-size: 14px;
    transition: color .15s, border-color .15s;
  }
  .logout:hover, .logout:focus {
    color: var(--accent);
    border-color: var(--accent);
  }
  .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: 1px;
    background: var(--faint);
  }
  .dot.ok   { background: var(--ok);   box-shadow: 0 0 6px var(--ok); }
  .dot.bad  { background: var(--bad);  box-shadow: 0 0 6px var(--bad); }

  /* ---- 区块 ---- */
  section { margin-bottom: 36px; }
  h2 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h2 .count {
    font-family: var(--mono);
    font-weight: 400;
    letter-spacing: 0;
    color: var(--faint);
    text-transform: none;
  }
  h2::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ---- 缓存填充条：本页的签名元素 ----
     已启用 = 实心填充；未启用 = 虚线空槽。
     「哪类缓存没在工作」不需要读文字，扫一眼槽的形状即可。 */
  .cache-row {
    display: grid;
    grid-template-columns: 110px 1fr 116px 80px;
    align-items: center;
    gap: 14px;
    padding: 7px 0;
  }
  .cache-name {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--text);
  }
  .bar {
    position: relative;
    height: 8px;
    background: var(--surface);
    border-radius: 2px;
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width .4s ease;
  }
  /* 未启用：虚线空槽 —— 视觉上与「已启用但为空」明确区分 */
  .bar.off {
    background: repeating-linear-gradient(
      90deg, var(--border) 0 4px, transparent 4px 8px);
  }
  .bar.off > i { display: none; }
  .cache-size {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--muted);
    text-align: right;
  }
  .cache-state { font-size: 14px; text-align: right; }
  .cache-state.on  { color: var(--ok); }
  .cache-state.off { color: var(--faint); }

  /* ---- 滚动容器 ----
     劫持规则与证书各有 30+ 条，全部铺开会把页面拉得很长。
     限高加滚动条，既能看到条数又不挤占其他区块。
     只对【数据列表】加，不含标题（标题要始终可见）。 */
  .scroll {
    max-height: 320px;
    overflow-y: auto;
    overscroll-behavior: contain;   /* 滚到底不带动整页 */
  }
  /* 滚动条样式：默认的在深色底上很突兀 */
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }
  .scroll::-webkit-scrollbar-thumb:hover { background: var(--faint); }
  /* 表头在滚动时保持可见 */
  .scroll thead th {
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }

  /* ---- 表格 ---- */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
  }
  th {
    text-align: left;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 12px 8px 0;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 7px 12px 7px 0;
    border-bottom: 1px solid rgba(35,43,54,.5);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: var(--mono); font-size: 14.5px; }
  .arrow { color: var(--faint); padding: 0 6px; }
  .muted { color: var(--muted); }
  .warn  { color: var(--warn); }
  .bad   { color: var(--bad); }

  /* ---- 状态与空态 ---- */
  .empty {
    color: var(--faint);
    font-size: 15px;
    padding: 18px 0;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    text-align: center;
  }
  .loading { color: var(--faint); font-size: 15px; padding: 18px 0; }

  .cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }

  code {
    font-family: var(--mono);
    font-size: 14.5px;
    background: var(--raise);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--muted);
  }

  a { color: var(--accent); }

  /* ---- 按钮 ---- */
  .btn {
    font: inherit;
    font-size: 14px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 3px 10px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .btn:hover, .btn:focus { color: var(--accent); border-color: var(--accent); }
  .btn.primary {
    color: var(--bg); background: var(--accent); border-color: var(--accent);
    font-weight: 600;
  }
  .btn.primary:hover, .btn.primary:focus { opacity: .85; color: var(--bg); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  h2 .btn { margin-left: 10px; text-transform: none; letter-spacing: 0; }

  /* ---- 弹层 ---- */
  dialog {
    max-width: 640px; width: calc(100% - 32px);
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin: 0 0 6px; font-size: 17px; }
  dialog .hint { color: var(--faint); font-size: 14px; margin: 0 0 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; font: inherit; font-size: 15px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 3px;
    padding: 7px 9px;
  }
  .field textarea { font-family: var(--mono); font-size: 14px; min-height: 300px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent);
  }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .msg { font-size: 14px; margin-top: 12px; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--bad); }

  /* ---- 改动预览 ---- */
  .changes { border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
  .change { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .change:last-child { border-bottom: none; }
  .change .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .change .what { font-size: 14px; margin-top: 3px; }
  .change .diff {
    font-family: var(--mono); font-size: 12.5px; color: var(--ok);
    margin-top: 5px; word-break: break-all;
  }
  .change .desc { font-size: 12.5px; color: var(--faint); margin-top: 4px; }

  @media (max-width: 720px) {
    .cols { grid-template-columns: 1fr; gap: 36px; }
    .cache-row { grid-template-columns: 92px 1fr 96px; }
    .cache-state { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>TProxy<span class="sub">缓存管理</span><span class="ver" id="version"></span></h1>
    <div class="host">
      <span><span class="dot" id="health-dot"></span><span id="health-text">连接中…</span></span>
      <span class="sep" id="host-sep" hidden>·</span>
      <span class="user" id="user-name"></span>
      <a class="logout" id="logout-link" href="/logout" hidden>退出</a>
    </div>
  </header>

  <section>
    <h2>缓存 <span class="count" id="cache-count"></span></h2>
    <div id="cache-list"><div class="loading">读取中…</div></div>
  </section>

  <section>
    <h2>缓存命中率 <span class="count" id="hit-count"></span></h2>
    <div id="hit-list"><div class="loading">读取中…</div></div>
  </section>

  <section>
    <h2>劫持规则 <span class="count" id="rule-count"></span>
      <button class="btn" id="add-upstream-btn">+ 添加上游</button>
    </h2>
    <div id="rule-list" class="scroll"><div class="loading">读取中…</div></div>
  </section>

  <div class="cols">
    <section>
      <h2>证书 <span class="count" id="cert-count"></span></h2>
      <div id="cert-list" class="scroll"><div class="loading">读取中…</div></div>
    </section>

    <section>
      <h2>分流入口 <span class="count" id="server-count"></span>
        <button class="btn" id="add-confd-btn">+ 新建</button>
      </h2>
      <div id="server-list" class="scroll"><div class="loading">读取中…</div></div>
    </section>
  </div>

</div>
<!-- 添加上游 -->
<dialog id="upstream-dialog">
  <h3>添加上游</h3>
  <p class="hint">会自动完成三处联动：DNS 劫持 + 签发证书 + tengine 分流。漏任何一处都不会报错，只是不生效。</p>
  <div class="field">
    <label for="up-domain">域名</label>
    <input id="up-domain" placeholder="repo.example.org" autocomplete="off" spellcheck="false">
  </div>
  <div class="field">
    <label for="up-category">类型（决定写进哪个分流文件）</label>
    <select id="up-category"></select>
  </div>
  <div id="up-preview"></div>
  <div class="actions">
    <button class="btn" id="up-cancel">取消</button>
    <button class="btn" id="up-preview-btn">预览改动</button>
    <button class="btn primary" id="up-apply-btn" disabled>确认添加</button>
  </div>
  <div class="msg" id="up-msg"></div>
</dialog>

<!-- 编辑分流配置 -->
<dialog id="confd-dialog">
  <h3 id="confd-title">编辑分流配置</h3>
  <p class="hint">
    容器内没有 nginx，无法做真正的语法校验 —— 只检查了花括号配对。
    保存后需重启 tengine，并在界面上确认各缓存仍正常。
  </p>
  <div class="field">
    <textarea id="confd-content" spellcheck="false"></textarea>
  </div>
  <div class="actions">
    <button class="btn" id="confd-cancel">取消</button>
    <button class="btn primary" id="confd-save">保存</button>
  </div>
  <div class="msg" id="confd-msg"></div>
</dialog>

<!-- 带版本号做缓存失效：改动前端后升 version.py 的版本即可让客户端拉到新版，
     否则浏览器会一直用缓存的旧 app.js -->
<script src="/static/app.js?v=0.2.6"></script>
</body>
</html>
